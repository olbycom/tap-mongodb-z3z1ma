[project]
name = "z3-tap-mongodb"
version = "0.4.6"
description = "z3-tap-mongodb is a Singer tap for MongoDB, built with the Meltano SDK for Singer Taps."
authors = [{ name = "Alex Butler", email = "butler.alex2010@gmail.com" }]
keywords = ["ELT", "MongoDB"]
license = { text = "Apache 2.0" }
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.25.1",
    "pymongo[srv]>=4.3.3",
    "orjson>=3.8.2",
    "genson>=1.2.2,<2",
    "pyyaml>=6.0,<7",
    "nekt-singer-sdk @ git+https://github.com/nektcom/singer-sdk.git@v0.3.4",
]

[project.scripts]
tap-mongodb = "tap_mongodb.tap:TapMongoDB.cli"

[dependency-groups]
dev = [
    "pytest>=6.2.5",
    "tox>=3.24.4",
    "flake8>=3.9.2",
    "black>=21.9",
    "pydocstyle>=6.1.1",
    "mypy>=0.910",
    "types-requests>=2.26.1",
    "isort>=5.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["tap_mongodb"]

[tool.black]
line-length = 100
target-version = ["py39"]
preview = true

[tool.isort]
color_output = true
line_length = 100
profile = "black"
src_paths = "tap_mongodb"

[tool.ruff]
line-length = 160

[tool.ruff.lint]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "D104",
    "F401",
]
"**/tests/**/*.py" = [
    "S101",
]
